name: Publish npm Package

on:
  push:
    tags: [ 'v*' ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter and tests
        run: |
          npm run lint
          npm run test

      - name: Build package
        run: npm run build

      - name: Update npm for OIDC support
        run: npm install -g npm@latest

      - name: Publish package (npm Trusted Publishing, no static token)
        run: |
          unset NODE_AUTH_TOKEN
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER already on registry, skipping publish"
          else
            npm publish
          fi
